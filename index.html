```html
<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    MAS FTJ 2026 — Scanner
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eeeeee;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    h2 {
      font-size: 20px;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #7b1535;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #stopButton {
      background: #555555;
      display: none;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    MAROONED ACTOR SOCIETY
  </h1>

  <h2>
    🎟️ FTJ 2026 SCANNER
  </h2>

  <button
    id="startButton"
    onclick="startCamera()"
  >
    BUKA KAMERA
  </button>

  <video
    id="camera"
    autoplay
    playsinline
  ></video>

  <button
    id="stopButton"
    onclick="stopCamera()"
  >
    TUTUP KAMERA
  </button>

  <div id="status">
    Tekan tombol untuk membuka kamera.
  </div>

</div>


<script>

let stream = null;


async function startCamera() {

  const video =
    document.getElementById(
      'camera'
    );

  const status =
    document.getElementById(
      'status'
    );

  const startButton =
    document.getElementById(
      'startButton'
    );

  const stopButton =
    document.getElementById(
      'stopButton'
    );


  startButton.disabled = true;


  status.textContent =
    'Meminta izin kamera...';


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: 'environment'
            }
          },

          audio: false

        });


    video.srcObject =
      stream;

    video.style.display =
      'block';


    stopButton.style.display =
      'block';


    status.textContent =
      '✅ Kamera berhasil dibuka!';


  }

  catch (error) {

    console.error(error);


    status.textContent =
      '❌ Kamera gagal dibuka: ' +
      error.name;


    startButton.disabled =
      false;

  }

}


function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }


  document
    .getElementById(
      'camera'
    )
    .style
    .display = 'none';


  document
    .getElementById(
      'stopButton'
    )
    .style
    .display = 'none';


  document
    .getElementById(
      'startButton'
    )
    .disabled = false;


  document
    .getElementById(
      'status'
    )
    .textContent =
      'Kamera ditutup.';

}

</script>

</body>

</html>
