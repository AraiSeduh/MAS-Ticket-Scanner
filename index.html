<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>SHIFT 4 — Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    h1 {
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    #startButton {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 15px;
    }

    #processing {
      display: none;
      text-align: center;
      padding: 50px 20px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #555;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #result {
      display: none;
      text-align: center;
      padding-top: 20px;
    }

    .result-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .ticket-info {
      text-align: left;
      background: #1c1c1c;
      border-radius: 12px;
      overflow: hidden;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      border-bottom: 1px solid #333;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #888;
    }

    .info-value {
      font-weight: bold;
      text-align: right;
    }

    #nextButton {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .error-text {
      color: #ff7777;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>SHIFT 4</h1>

  <div class="subtitle">
    Ticket Scanner
  </div>


  <div id="scannerSection">

    <div id="reader"></div>

    <button
      id="startButton">
      📷 BUKA KAMERA
    </button>

    <div id="status">
      Tekan tombol untuk membuka kamera.
    </div>

  </div>


  <div id="processing">

    <div class="spinner"></div>

    <div>
      MEMPROSES TIKET...
    </div>

  </div>


  <div id="result">

    <div
      id="resultIcon"
      class="result-icon">
    </div>

    <div
      id="resultTitle"
      class="result-title">
    </div>


    <div
      id="ticketInfo"
      class="ticket-info">

      <div class="info-row">

        <div class="info-label">
          Nama
        </div>

        <div
          id="infoName"
          class="info-value">
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          Warna
        </div>

        <div
          id="infoColor"
          class="info-value">
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          Jumlah
        </div>

        <div
          id="infoQuantity"
          class="info-value">
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          Waktu
        </div>

        <div
          id="infoTime"
          class="info-value">
        </div>

      </div>

    </div>


    <button
      id="nextButton">
      SCAN TIKET BERIKUTNYA
    </button>

  </div>

</div>


<script>

/* =========================================
   APPS SCRIPT URL
========================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzWD-Ei55rspe66t7yZdTSuW0TygdqvhBm_z8fUFzK6BskXMByU0Md6Us5emQ8eHoYPmQ/exec";


/* =========================================
   VARIABLES
========================================= */

let scanner = null;

let scannerRunning = false;

let processing = false;


/* =========================================
   START BUTTON
========================================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startScanner
  );


async function startScanner() {

  if (scannerRunning) {
    return;
  }


  /*
   * Kamera hanya boleh diakses dari
   * HTTPS / localhost.
   */

  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost"
  ) {

    showStatus(
      "Scanner harus dibuka melalui HTTPS."
    );

    return;
  }


  document
    .getElementById("startButton")
    .disabled = true;


  showStatus(
    "Meminta izin kamera..."
  );


  try {

    /*
     * Explicit permission request.
     * Ini membantu browser menampilkan
     * permission prompt sebelum html5-qrcode.
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    /*
     * Setelah permission berhasil,
     * matikan stream sementara.
     * html5-qrcode akan membuka kamera
     * secara normal setelah ini.
     */

    stream
      .getTracks()
      .forEach(track => track.stop());


    await openHtml5Scanner();

  } catch (error) {

    console.error(error);

    document
      .getElementById("startButton")
      .disabled = false;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      showStatus(
        "Kamera ditolak browser. Izinkan Camera untuk situs ini, lalu refresh halaman."
      );

    } else if (
      error.name ===
      "NotFoundError"
    ) {

      showStatus(
        "Kamera tidak ditemukan di perangkat."
      );

    } else if (
      error.name ===
      "NotReadableError"
    ) {

      showStatus(
        "Kamera sedang digunakan aplikasi lain."
      );

    } else {

      showStatus(
        "Kamera gagal dibuka: " +
        error.name
      );
    }
  }
}


/* =========================================
   OPEN HTML5 QR
========================================= */

async function openHtml5Scanner() {

  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 280
        },

        aspectRatio: 1.0
      },

      onScanSuccess,

      () => {
        // Jangan tampilkan error
        // setiap frame yang belum terbaca.
      }

    );


    scannerRunning = true;

    showStatus(
      "Arahkan kamera ke QR tiket."
    );


  } catch (error) {

    console.error(error);

    document
      .getElementById("startButton")
      .disabled = false;

    showStatus(
      "Kamera gagal dimulai."
    );
  }
}


/* =========================================
   QR BERHASIL TERBACA
========================================= */

async function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  /*
   * Hentikan scanner segera supaya
   * QR yang sama tidak terbaca berkali-kali.
   */

  await stopScanner();


  document
    .getElementById("scannerSection")
    .style.display = "none";


  document
    .getElementById("processing")
    .style.display = "block";


  /*
   * Kirim ke Apps Script via JSONP.
   */

  checkTicket(decodedText);
}


/* =========================================
   STOP SCANNER
========================================= */

async function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    if (scannerRunning) {
      await scanner.stop();
    }

  } catch (error) {

    console.warn(
      "Scanner stop:",
      error
    );

  }


  try {
    await scanner.clear();
  } catch (error) {}


  scanner = null;
  scannerRunning = false;
}


/* =========================================
   CHECK TICKET JSONP
========================================= */

function checkTicket(token) {

  const callbackName =
    "ticketCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      delete window[callbackName];

      handleServerResult(result);
    };


  const script =
    document.createElement("script");


  const url =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&token=" +
    encodeURIComponent(token) +
    "&callback=" +
    callbackName +
    "&_=" +
    Date.now();


  script.src = url;


  script.onerror = function() {

    delete window[callbackName];

    handleServerError(
      "Server tidak dapat dihubungi."
    );
  };


  document
    .body
    .appendChild(script);


  /*
   * Timeout.
   */

  setTimeout(() => {

    if (window[callbackName]) {

      delete window[callbackName];

      handleServerError(
        "Server tidak merespons."
      );
    }

  }, 15000);
}


/* =========================================
   SERVER RESULT
========================================= */

function handleServerResult(result) {

  document
    .getElementById("processing")
    .style.display = "none";


  document
    .getElementById("result")
    .style.display = "block";


  if (result.success) {

    showSuccess(result);

    return;
  }


  if (result.alreadyCheckedIn) {

    showAlreadyUsed(result);

    return;
  }


  if (result.notFound) {

    showInvalid(result);

    return;
  }


  showErrorResult(
    result.message ||
    "Terjadi kesalahan."
  );
}


/* =========================================
   SUCCESS
========================================= */

function showSuccess(result) {

  document
    .getElementById("resultIcon")
    .textContent = "✓";


  document
    .getElementById("resultTitle")
    .textContent =
      "TIKET TERKONFIRMASI";


  fillInfo(result);

}


/* =========================================
   ALREADY USED
========================================= */

function showAlreadyUsed(result) {

  document
    .getElementById("resultIcon")
    .textContent = "⚠";


  document
    .getElementById("resultTitle")
    .textContent =
      "TIKET SUDAH DIGUNAKAN";


  fillInfo(result);

}


/* =========================================
   INVALID
========================================= */

function showInvalid(result) {

  document
    .getElementById("resultIcon")
    .textContent = "✕";


  document
    .getElementById("resultTitle")
    .textContent =
      "TIKET TIDAK VALID";


  document
    .getElementById("ticketInfo")
    .style.display = "none";
}


/* =========================================
   ERROR
========================================= */

function showErrorResult(message) {

  document
    .getElementById("resultIcon")
    .textContent = "✕";


  document
    .getElementById("resultTitle")
    .textContent =
      message;


  document
    .getElementById("ticketInfo")
    .style.display = "none";
}


/* =========================================
   FILL INFO
========================================= */

function fillInfo(result) {

  document
    .getElementById("ticketInfo")
    .style.display = "block";


  document
    .getElementById("infoName")
    .textContent =
      result.name || "-";


  document
    .getElementById("infoColor")
    .textContent =
      result.color || "-";


  document
    .getElementById("infoQuantity")
    .textContent =
      result.quantity || "-";


  document
    .getElementById("infoTime")
    .textContent =
      formatTime(result.checkInTime);
}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (isNaN(date.getTime())) {
    return value;
  }


  return date.toLocaleString(
    "id-ID",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    }
  );
}


/* =========================================
   NEXT SCAN
========================================= */

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    resetScanner
  );


async function resetScanner() {

  processing = false;


  document
    .getElementById("result")
    .style.display = "none";


  document
    .getElementById("ticketInfo")
    .style.display = "block";


  document
    .getElementById("scannerSection")
    .style.display = "block";


  document
    .getElementById("startButton")
    .disabled = false;


  document
    .getElementById("status")
    .textContent =
      "Tekan tombol untuk membuka kamera.";
}


/* =========================================
   STATUS
========================================= */

function showStatus(message) {

  document
    .getElementById("status")
    .textContent =
      message;
}


/* =========================================
   SERVER ERROR
========================================= */

function handleServerError(message) {

  document
    .getElementById("processing")
    .style.display = "none";


  document
    .getElementById("result")
    .style.display = "block";


  showErrorResult(message);
}

</script>

</body>

</html>
