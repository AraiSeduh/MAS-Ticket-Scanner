<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAS FTJ 2026 — Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 24px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 20px;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    button {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #startButton {
      background: white;
      color: #111;
    }

    #scanAgainButton {
      background: #7b1535;
      color: white;
    }

    #status {
      margin: 15px auto;
      max-width: 420px;
      padding: 12px;
      border-radius: 10px;
      background: #222;
      color: #ddd;
      font-size: 14px;
    }

    #result {
      display: none;
      max-width: 420px;
      margin: 20px auto;
      padding: 25px 20px;
      border-radius: 15px;
      background: #222;
    }

    #resultIcon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    #resultTitle {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .success {
      color: #4ade80;
    }

    .warning {
      color: #facc15;
    }

    .error {
      color: #f87171;
    }

    .ticket-info {
      text-align: left;
      background: #151515;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #999;
    }

    .info-value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MAROONED ACTOR SOCIETY</h1>
  <div class="subtitle">FTJ 2026 — Ticket Scanner</div>

  <div id="scannerSection">

    <div id="reader"></div>

    <button id="startButton" onclick="startScanner()">
      📷 BUKA KAMERA
    </button>

    <div id="status">
      Scanner siap.
    </div>

  </div>

  <div id="result">

    <div id="resultIcon"></div>

    <div id="resultTitle"></div>

    <div class="ticket-info">

      <div class="info-row">
        <span class="info-label">Ticket ID</span>
        <span class="info-value" id="ticketId">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Nama</span>
        <span class="info-value" id="ticketName">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Jenis Tiket</span>
        <span class="info-value" id="ticketType">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Check-in</span>
        <span class="info-value" id="checkInTime">-</span>
      </div>

    </div>

    <button id="scanAgainButton" onclick="scanAgain()">
      📷 SCAN TIKET BERIKUTNYA
    </button>

  </div>

</div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzWD-Ei55rspe66t7yZdTSuW0TygdqvhBm_z8fUFzK6BskXMByU0Md6Us5emQ8eHoYPmQ/exec";

let html5QrCode = null;
let processingScan = false;


/* =========================
   START SCANNER
========================= */

function startScanner() {

  if (processingScan) {
    return;
  }

  if (typeof Html5Qrcode === "undefined") {

    document.getElementById("status").textContent =
      "❌ Library scanner gagal dimuat.";

    return;
  }

  if (!window.isSecureContext) {

    document.getElementById("status").textContent =
      "❌ Scanner harus dibuka melalui HTTPS.";

    return;
  }

  document.getElementById("status").textContent =
    "Mengaktifkan kamera...";

  document.getElementById("startButton").disabled = true;

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      aspectRatio: 1.0
    },

    onScanSuccess,

    onScanFailure

  ).then(function() {

    document.getElementById("status").textContent =
      "📷 Kamera aktif — arahkan ke QR tiket.";

  }).catch(function(error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ Kamera gagal dibuka: " + error;

    document.getElementById("startButton").disabled = false;

  });

}


/* =========================
   QR SCAN SUCCESS
========================= */

function onScanSuccess(decodedText, decodedResult) {

  if (processingScan) {
    return;
  }

  processingScan = true;

  document.getElementById("status").textContent =
    "Memverifikasi tiket...";

  stopScanner()
    .then(function() {

      sendTokenToAppsScript(decodedText);

    })
    .catch(function() {

      sendTokenToAppsScript(decodedText);

    });

}


/* =========================
   SCAN FAILURE
========================= */

function onScanFailure(error) {
  // Sengaja kosong.
  // QR belum terbaca bukan error.
}


/* =========================
   STOP CAMERA
========================= */

function stopScanner() {

  if (!html5QrCode) {
    return Promise.resolve();
  }

  return html5QrCode.stop()
    .then(function() {

      html5QrCode.clear();
      html5QrCode = null;

    })
    .catch(function(error) {

      console.warn("Scanner stop:", error);

      html5QrCode = null;

    });

}


/* =========================
   SEND TOKEN TO APPS SCRIPT
========================= */

function sendTokenToAppsScript(token) {

  const callbackName =
    "checkInCallback_" + Date.now();

  const script =
    document.createElement("script");

  const timeout =
    setTimeout(function() {

      cleanup();

      showError(
        "GAGAL TERHUBUNG",
        "Scanner tidak dapat menghubungi server."
      );

    }, 10000);


  window[callbackName] = function(result) {

    clearTimeout(timeout);

    cleanup();

    handleServerResult(result);

  };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window[callbackName];

  }


  script.onerror = function() {

    clearTimeout(timeout);

    cleanup();

    showError(
      "GAGAL TERHUBUNG",
      "Server tidak dapat dihubungi."
    );

  };


  script.src =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&token=" +
    encodeURIComponent(token) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  document.body.appendChild(script);

}


/* =========================
   SERVER RESULT
========================= */

function handleServerResult(result) {

  if (!result) {

    showError(
      "GAGAL TERHUBUNG",
      "Server memberikan respons kosong."
    );

    return;
  }


  if (result.success) {

    showSuccess(result);

    return;
  }


  if (result.alreadyCheckedIn) {

    showWarning(result);

    return;
  }


  if (result.notFound) {

    showError(
      "TIKET TIDAK VALID",
      result.message || "QR tidak terdaftar."
    );

    return;
  }


  showError(
    "GAGAL MEMPROSES",
    result.message || "Terjadi kesalahan."
  );

}


/* =========================
   SUCCESS
========================= */

function showSuccess(result) {

  showResultScreen();

  document.getElementById("resultIcon").textContent =
    "✅";

  document.getElementById("resultTitle").textContent =
    "TIKET TERKONFIRMASI";

  document.getElementById("resultTitle").className =
    "success";

  fillTicketInfo(result);

}


/* =========================
   ALREADY CHECKED IN
========================= */

function showWarning(result) {

  showResultScreen();

  document.getElementById("resultIcon").textContent =
    "⚠️";

  document.getElementById("resultTitle").textContent =
    "TIKET SUDAH DIGUNAKAN";

  document.getElementById("resultTitle").className =
    "warning";

  fillTicketInfo(result);

}


/* =========================
   ERROR
========================= */

function showError(title, message) {

  showResultScreen();

  document.getElementById("resultIcon").textContent =
    "❌";

  document.getElementById("resultTitle").textContent =
    title;

  document.getElementById("resultTitle").className =
    "error";

  document.getElementById("ticketId").textContent =
    "-";

  document.getElementById("ticketName").textContent =
    message;

  document.getElementById("ticketType").textContent =
    "-";

  document.getElementById("checkInTime").textContent =
    "-";

}


/* =========================
   FILL TICKET INFO
========================= */

function fillTicketInfo(result) {

  document.getElementById("ticketId").textContent =
    result.ticketId || "-";

  document.getElementById("ticketName").textContent =
    result.name || "-";

  document.getElementById("ticketType").textContent =
    result.ticketType || "-";


  if (result.checkInTime) {

    const date =
      new Date(result.checkInTime);

    if (!isNaN(date.getTime())) {

      document.getElementById("checkInTime").textContent =
        date.toLocaleString("id-ID");

    } else {

      document.getElementById("checkInTime").textContent =
        result.checkInTime;

    }

  } else {

    document.getElementById("checkInTime").textContent =
      "-";

  }

}


/* =========================
   SHOW RESULT
========================= */

function showResultScreen() {

  document.getElementById("scannerSection")
    .classList.add("hidden");

  document.getElementById("result")
    .style.display = "block";

}


/* =========================
   SCAN AGAIN
========================= */

function scanAgain() {

  processingScan = false;

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("scannerSection")
    .classList.remove("hidden");

  document.getElementById("status").textContent =
    "Scanner siap.";

  document.getElementById("startButton").disabled =
    false;

  startScanner();

}

</script>

</body>
</html>
