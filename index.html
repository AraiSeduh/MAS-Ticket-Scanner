<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MAS FTJ 2026 — Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #222;
      text-align: center;
      font-weight: bold;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }

    #result.success {
      display: block;
      background: #123d24;
      border: 2px solid #2ecc71;
    }

    #result.error {
      display: block;
      background: #421919;
      border: 2px solid #e74c3c;
    }

    #result.warning {
      display: block;
      background: #443914;
      border: 2px solid #f1c40f;
    }

    .result-icon {
      font-size: 50px;
    }

    .result-title {
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #7b1535;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #scanAgain {
      display: none;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>MAROONED ACTOR SOCIETY</h1>

  <div class="subtitle">
    FTJ 2026 — Ticket Scanner
  </div>

  <div id="reader"></div>

  <div id="status">
    Scanner siap.
  </div>

  <button
    id="startButton"
    onclick="startScanner()"
  >
    📷 BUKA KAMERA
  </button>

  <div id="result">

    <div
      id="resultIcon"
      class="result-icon"
    ></div>

    <div
      id="resultTitle"
      class="result-title"
    ></div>

    <div id="resultInfo"></div>

  </div>

  <button
    id="scanAgain"
    onclick="scanAgain()"
  >
    SCAN TIKET BERIKUTNYA
  </button>

</div>


<script>

/* =========================================
   APPS SCRIPT URL
========================================= */

const APPS_SCRIPT_URL =
  "PASTE_URL_APPS_SCRIPT_LO_DI_SINI";


/* =========================================
   VARIABLES
========================================= */

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* =========================================
   START SCANNER
========================================= */

function startScanner() {

  const status =
    document.getElementById("status");

  const startButton =
    document.getElementById("startButton");


  status.textContent =
    "⏳ Memuat scanner...";

  startButton.disabled = true;


  /* CEK LIBRARY */

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    status.textContent =
      "❌ Library scanner gagal dimuat.";

    startButton.disabled = false;

    return;

  }


  /* CEK HTTPS */

  if (
    location.protocol !==
    "https:" &&
    location.hostname !==
    "localhost"
  ) {

    status.textContent =
      "❌ Scanner harus dibuka melalui HTTPS.";

    startButton.disabled = false;

    return;

  }


  processingScan = false;


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  status.textContent =
    "📷 Meminta akses kamera...";


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scannerRunning = true;

    startButton.style.display =
      "none";

    status.textContent =
      "📷 Kamera aktif — arahkan ke QR tiket.";

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );

    scannerRunning = false;

    startButton.disabled = false;

    status.textContent =
      "❌ Kamera gagal dibuka: " +
      error;

  });

}


/* =========================================
   QR SUCCESS
========================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (processingScan) {
    return;
  }

  processingScan = true;


  alert(
    "QR TERBACA!\n\n" +
    decodedText
  );


  stopScanner();


  document.getElementById(
    "status"
  ).textContent =
    "⏳ Memeriksa tiket...";


  sendTokenToAppsScript(
    decodedText
  );

}


/* =========================================
   QR FAILURE
========================================= */

function onScanFailure(error) {

  // Normal ketika kamera sedang mencari QR.

}


/* =========================================
   STOP
========================================= */

function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

      })
      .catch(function(error) {

        console.error(
          "Stop error:",
          error
        );

      });

  }

}


/* =========================================
   SEND TO APPS SCRIPT
========================================= */

function sendTokenToAppsScript(
  token
) {

  const callbackName =
    "checkInCallback_" +
    Date.now();


  let script = null;


  window[
    callbackName
  ] = function(result) {

    delete window[
      callbackName
    ];


    if (script) {
      script.remove();
    }


    showResult(result);

  };


  script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&token=" +
    encodeURIComponent(token) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      script.remove();


      showResult({

        success: false,

        message:
          "Gagal terhubung ke server."

      });

    };


  document.body.appendChild(
    script
  );

}


/* =========================================
   SHOW RESULT
========================================= */

function showResult(result) {

  const resultBox =
    document.getElementById(
      "result"
    );

  const icon =
    document.getElementById(
      "resultIcon"
    );

  const title =
    document.getElementById(
      "resultTitle"
    );

  const info =
    document.getElementById(
      "resultInfo"
    );


  resultBox.className = "";


  if (result.success) {

    resultBox.classList.add(
      "success"
    );

    icon.textContent = "✅";

    title.textContent =
      "CHECK-IN BERHASIL";

    info.innerHTML =
      "<strong>" +
      escapeHtml(result.name) +
      "</strong><br>" +
      "Ticket ID: " +
      escapeHtml(result.ticketId) +
      "<br>" +
      "Tipe: " +
      escapeHtml(result.ticketType);

  }

  else if (
    result.alreadyCheckedIn
  ) {

    resultBox.classList.add(
      "warning"
    );

    icon.textContent = "⚠️";

    title.textContent =
      "TIKET SUDAH DIGUNAKAN";

    info.innerHTML =
      "<strong>" +
      escapeHtml(result.name) +
      "</strong><br>" +
      "Ticket ID: " +
      escapeHtml(result.ticketId);

  }

  else {

    resultBox.classList.add(
      "error"
    );

    icon.textContent = "❌";

    title.textContent =
      "TIKET TIDAK VALID";

    info.textContent =
      result.message ||
      "Tiket tidak ditemukan.";

  }


  resultBox.style.display =
    "block";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).textContent =
    "Scan selesai.";

}


/* =========================================
   SCAN AGAIN
========================================= */

function scanAgain() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "startButton"
  ).disabled =
    false;


  startScanner();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}

</script>

</body>
</html>
